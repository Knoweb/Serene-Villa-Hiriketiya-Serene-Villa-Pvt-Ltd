spring.application.name=pms
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/serene_villa_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable spring security basic login prompt for skeletal API testing (permit all temporarily)
# We will create custom security rules or filter configs

# Increase max file upload and request limits for base64 strings
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-form-post-size=50MB
