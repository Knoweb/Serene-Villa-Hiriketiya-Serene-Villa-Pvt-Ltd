version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: serene_villa_db
    restart: always
    environment:
      MYSQL_DATABASE: serene_villa_db
      MYSQL_ROOT_PASSWORD: rootpassword
      TZ: Asia/Colombo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: serene_villa_backend
    restart: always
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/serene_villa_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_TIME_ZONE=Asia/Colombo
      - SPRING_JACKSON_TIME_ZONE=Asia/Colombo
      - TZ=Asia/Colombo
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: serene_villa_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

  frontend_hiriketiya:
    build:
      context: ./frontend-hiriketiya
      dockerfile: Dockerfile
    container_name: serene_villa_frontend_hiriketiya
    restart: always
    depends_on:
      - backend
    ports:
      - "81:80"

volumes:
  mysql_data:
